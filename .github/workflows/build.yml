name: Build Bakaiti APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Print debug.keystore SHA-1 (diagnostic)
      run: keytool -list -v -keystore app/debug.keystore -storepass android -keypass android | grep -A1 "SHA1:"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bakaiti-App
        path: app/build/outputs/apk/debug/app-debug.apk
